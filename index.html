let S = {
  phase:'register',   // register|welcome|pretest|lesson|posttest|summary
  ch:0, node:0,
  xp:0, lives:5,
  preAns:[], postAns:[],
  quizAns:{}, matchSt:{}, sortSt:{}, scrambleSt:{}, dragFillSt:{},
  chCorrect:[0,0,0], chTotal:[0,0,0],
  totalCorrect:0, totalQ:0,
  scrambleIdx:{},
  student:{name:'', cls:'', date:'', avatar:'🧑‍🚀'}
};

/* ================================================================
   HELPERS
   ================================================================ */
function ch(){return CHAPTERS[S.ch];}
function node(){return ch().nodes[S.node];}
function totalSteps(){
  let t=2; // pretest + posttest
  CHAPTERS.forEach(c=>t+=c.nodes.length);
  return t;
}
function currentStep(){
  if(S.phase==='register') return 0;
  if(S.phase==='welcome') return 0;
  if(S.phase==='pretest') return 1;
  if(S.phase==='lesson'){
    let t=2;
    for(let i=0;i<S.ch;i++) t+=CHAPTERS[i].nodes.length;
    return t+S.node;
  }
  if(S.phase==='posttest') return totalSteps()-1;
  return totalSteps();
}
function updateUI(){
  const isReg = S.phase==='register';
  const isTeacher = S.phase==='teacher';
  const stu = S.student||{};
  const titleEl = document.getElementById('tb-title');
  const chTagEl = document.getElementById('tb-chapter-tag');
  if(titleEl){
    if(isTeacher){
      titleEl.textContent='📊 Dashboard ครู';
      if(chTagEl) chTagEl.style.display='none';
    } else if(stu.name && !isReg){
      titleEl.innerHTML=`<span style="font-size:12px;">${stu.avatar||'👤'} ${stu.name}</span>`;
      if(chTagEl){
        if(S.phase==='lesson'){
          chTagEl.style.display='';
          chTagEl.textContent=`บทที่ ${S.ch+1} / 3`;
          chTagEl.style.color=['var(--blue)','var(--teal)','var(--violet)'][S.ch]||'var(--blue)';
        } else {
          chTagEl.style.display='none';
        }
      }
    } else {
      titleEl.textContent='กำเนิดเอกภพ · ว33101 ม.6';
      if(chTagEl) chTagEl.style.display='none';
    }
  }
  const livesEl=document.getElementById('tb-lives');
  const xpEl=document.getElementById('tb-xp');
  const resetEl=document.getElementById('tb-reset');
  const teacherEl=document.getElementById('tb-teacher');
  const progWrap=document.getElementById('prog-fill')?.parentElement;
  const navbar=document.querySelector('.navbar');
  const hideGame = isReg || isTeacher;
  if(livesEl) livesEl.style.display=hideGame?'none':'';
  if(xpEl) xpEl.style.display=hideGame?'none':'';
  if(resetEl){ resetEl.style.display=hideGame?'none':'flex'; }
  if(teacherEl){ teacherEl.style.display=isReg?'none':'flex'; teacherEl.classList.toggle('active',isTeacher); }
  if(progWrap) progWrap.style.display=isReg?'none':'';
  if(navbar) navbar.style.display=(isReg||isTeacher)?'none':'flex';
  if(!hideGame){
    document.getElementById('tb-lives').textContent='❤️'.repeat(Math.max(0,S.lives));
    document.getElementById('tb-xp').textContent=S.xp+' XP';
    const pct=(currentStep()/totalSteps())*100;
    document.getElementById('prog-fill').style.width=pct+'%';
  }
  const back=document.getElementById('btn-back');
  const next=document.getElementById('btn-next');
  if(!back||!next) return;
  back.disabled=(isReg||isTeacher||S.phase==='welcome'||S.phase==='pretest'||S.phase==='summary');
  // lock next for interactive nodes
  const n=S.phase==='lesson'?node():null;
  if(n){
    if(n.type==='quiz_mid'){
      const k=`${S.ch}-${S.node}`;
      const a=S.quizAns[k]||[];
      next.disabled=a.length<n.questions.length||a.some(x=>x===undefined);
    } else if(n.type==='match'){
      const k=`${S.ch}-${S.node}`;
      const ms=S.matchSt[k];
      next.disabled=!(ms&&ms.matched.size===n.pairs.length);
    } else if(n.type==='sort'){
      const k=`${S.ch}-${S.node}`;
      const ss=S.sortSt[k];
      next.disabled=!(ss&&ss.checked&&ss.correct);
    } else if(n.type==='scramble'){
      const k=`${S.ch}-${S.node}`;
      const si=S.scrambleIdx[k]||0;
      const done=(S.scrambleSt[k]||[]).filter((x,i)=>i<n.words.length&&x===true).length===n.words.length;
      next.disabled=!done;
    } else if(n.type==='drag_fill'){
      const k=`${S.ch}-${S.node}`;
      const df=S.dragFillSt[k];
      next.disabled=!(df&&df.checked&&df.correct);
    } else {
      next.disabled=false;
    }
  } else if(S.phase==='register'){
    next.disabled=true;
  } else if(S.phase==='pretest'){
    next.disabled=S.preAns.some(x=>x===undefined)||S.preAns.length<PRE_TEST.length;
  } else if(S.phase==='posttest'){
    next.disabled=S.postAns.some(x=>x===undefined)||S.postAns.length<POST_TEST.length;
  } else {
    next.disabled=false;
  }
  // nb-info
  let info='';
  if(S.phase==='lesson'){
    info=`บทที่ ${S.ch+1} · <strong>หน้า ${S.node+1}/${ch().nodes.length}</strong>`;
  } else if(S.phase==='pretest') info='<strong>แบบทดสอบก่อนเรียน</strong>';
  else if(S.phase==='posttest') info='<strong>แบบทดสอบหลังเรียน</strong>';
  else if(S.phase==='summary') info='<strong>สรุปผลการเรียน</strong>';
  document.getElementById('nb-info').innerHTML=info;
}

/* ================================================================
   NAVIGATION
   ================================================================ */
function goNext(){
  if(S.phase==='welcome'){S.phase='pretest';render(true);return;}
  if(S.phase==='pretest'){S.phase='lesson';S.ch=0;S.node=0;render(true);return;}
  if(S.phase==='lesson'){
    const nodes=ch().nodes;
    if(S.node<nodes.length-1){S.node++;render(true);}
    else if(S.ch<CHAPTERS.length-1){S.ch++;S.node=0;render(true);}
    else{S.phase='posttest';render(true);}
    return;
  }
  if(S.phase==='posttest'){S.phase='summary';render(true);return;}
}
function goBack(){
  if(S.phase==='lesson'){
    if(S.node>0){S.node--;render(true);}
    else if(S.ch>0){S.ch--;S.node=ch().nodes.length-1;render(true);}
  }
}

/* ================================================================
   RENDER DISPATCHER
   ================================================================ */
function render(scrollTop){
  // scrollTop=true → scroll to top (phase transitions)
  // scrollTop=false/undefined → keep position (quiz answers within same phase)
  updateUI();
  const m=document.getElementById('main');
  let html='';
  if(S.phase==='register') html=renderRegister();
  else if(S.phase==='welcome') html=renderWelcome();
  else if(S.phase==='pretest') html=renderTest('pre');
  else if(S.phase==='lesson') html=renderLesson();
  else if(S.phase==='posttest') html=renderTest('post');
  else if(S.phase==='summary') html=renderSummary();
  else if(S.phase==='teacher') html=renderTeacherDash();
  m.innerHTML=html;
  // post-render hooks
  if(S.phase==='lesson'){
    const n=node();
    if(n.type==='sort') initSort();
    if(n.type==='scramble') initScramble();
    if(n.type==='drag_fill') initDragFill();
    if(n.type==='ch_complete') setTimeout(launchConfetti,80);
  }
  // Scroll to top only on explicit phase transitions
  if(scrollTop) window.scrollTo({top:0,behavior:'smooth'});
  saveProgress();
  // Animate score ring after DOM is ready
  if(S.phase==='summary') setTimeout(animateScoreRing, 80);
}

function renderTest(mode){
  const qs = mode==='pre' ? PRE_TEST : POST_TEST;
  const ans = mode==='pre' ? S.preAns : S.postAns;
  const label = mode==='pre' ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน';
  const icon = mode==='pre' ? '📋' : '📝';
  const desc = mode==='pre'
    ? 'ทดสอบความรู้เดิมก่อนเรียน ไม่ต้องกังวลถ้าตอบไม่ได้ — เราจะเรียนรู้ไปด้วยกันครับ'
    : 'ทดสอบหลังเรียนครบทั้ง 3 บทแล้ว ลองตอบให้ดีที่สุดนะครับ';
  const allDone = ans.length===qs.length && ans.every(x=>x!==undefined);

  return `<div class="test-screen">
    <div class="test-icon">${icon}</div>
    <div class="test-title">${label}</div>
    <div class="test-sub">${desc}</div>
  </div>
  ${qs.map((q,qi)=>{
    const picked=ans[qi];
    const done=picked!==undefined;
    const ok=picked===q.ans;
    return `<div class="card" id="qcard-${qi}">
      <div class="card-header">
        <span style="font-size:11px;color:var(--t3);">ข้อ ${qi+1} / ${qs.length}</span>
        <span class="badge b-gold">${q.topic}</span>
      </div>
      <div class="card-body">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts">
          ${q.opts.map((o,oi)=>{
            let cls='';
            if(done){if(mode==='post'){cls=oi===q.ans?'correct disabled':oi===picked&&!ok?'wrong disabled':'disabled';}else{cls=oi===picked?'picked disabled':'disabled';}}
            return `<button class="qopt ${cls}" data-qi="${qi}" data-oi="${oi}" onclick="answerTest('${mode}',${qi},${oi})">
              <span class="qletter">${String.fromCharCode(65+oi)}</span>${o}
            </button>`;
          }).join('')}
        </div>
        ${done && mode==='post'?`<div class="qfb show ${ok?'fb-ok':'fb-bad'}">${ok?'✅ ถูกต้อง!'+(q.fb?'<br><span style="font-size:12px;opacity:.85;">💡 '+q.fb+'</span>':''):'❌ ไม่ถูกต้อง — คำตอบที่ถูกคือ: <strong>'+q.opts[q.ans]+'</strong>'+(q.fb?'<br><span style="font-size:12px;opacity:.85;display:block;margin-top:4px;">💡 '+q.fb+'</span>':'')}</div>`:''}
      </div>
    </div>`;
  }).join('')}`;
}

function answerTest(mode,qi,oi){
  const qs = mode==='pre' ? PRE_TEST : POST_TEST;
  const ans = mode==='pre' ? S.preAns : S.postAns;
  if(ans[qi]!==undefined) return;
  ans[qi]=oi;
  const ok=oi===qs[qi].ans;
  if(mode==='post'){
    S.totalQ++;
    if(ok){S.totalCorrect++;S.xp+=30;}else{S.xp+=5;S.lives=Math.max(0,S.lives-1);}
  }
  /* Targeted DOM update — no full re-render */
  const card=document.getElementById('qcard-'+qi);
  if(card){
    card.querySelectorAll('.qopt').forEach(function(btn){
      const boi=parseInt(btn.dataset.oi);
      btn.classList.add('disabled');
      if(mode==='post'){
        if(boi===qs[qi].ans) btn.classList.add('correct');
        else if(boi===oi && !ok) btn.classList.add('wrong');
      } else {
        if(boi===oi) btn.classList.add('picked');
      }
    });
    /* ใส่ feedback เฉพาะ post-test */
    if(mode==='post'){
      const fb=document.createElement('div');
      const q=qs[qi];
      fb.className='qfb show '+(ok?'fb-ok':'fb-bad');
      fb.innerHTML=ok
        ?'✅ ถูกต้อง!'+(q.fb?'<br><span style="font-size:12px;opacity:.85;">💡 '+q.fb+'</span>':'')
        :'❌ ไม่ถูกต้อง — คำตอบที่ถูกคือ: <strong>'+q.opts[q.ans]+'</strong>'+(q.fb?'<br><span style="font-size:12px;opacity:.85;display:block;margin-top:4px;">💡 '+q.fb+'</span>':'');
      card.querySelector('.card-body').appendChild(fb);
    }
  } else {
    render(); /* fallback */
  }
  updateUI();
  saveProgress();
  if(!ok && S.lives===0) setTimeout(showGameOver,400);
}

/* ── MATCH ── */
function renderMatch(n){
  const k=`${S.ch}-${S.node}`;
  if(!S.matchSt[k]){
    const ro=[...Array(n.pairs.length).keys()];
    for(let i=ro.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ro[i],ro[j]]=[ro[j],ro[i]];}
    S.matchSt[k]={sel:null,side:null,matched:new Set(),wrongPair:null,rightOrder:ro};
  }
  const ms=S.matchSt[k];
  const allDone=ms.matched.size===n.pairs.length;
  let lH='',rH='';
  n.pairs.forEach((p,i)=>{
    const m=ms.matched.has(i),sel=ms.sel===i&&ms.side==='left',wr=ms.wrongPair&&ms.wrongPair.l===i;
    lH+=`<div class="mi${m?' matched':sel?' sel':wr?' flash':''}" onclick="selMatch('left',${i})">${p.left}</div>`;
  });
  ms.rightOrder.forEach(ri=>{
    const p=n.pairs[ri];
    const m=[...ms.matched].includes(ri),sel=ms.sel===ri&&ms.side==='right',wr=ms.wrongPair&&ms.wrongPair.r===ri;
    rH+=`<div class="mi${m?' matched':sel?' sel':wr?' flash':''}" onclick="selMatch('right',${ri})">${p.right}</div>`;
  });
  const pips=n.pairs.map((_,i)=>`<div class="mpip${ms.matched.has(i)?' done':''}"></div>`).join('');
  return `<div class="card">
    <div class="card-header"><span class="badge b-orange">🧩 เกม: จับคู่</span><span style="font-size:11px;color:var(--t3);">${ms.matched.size}/${n.pairs.length} คู่</span></div>
    <div class="card-body">
      <div style="font-size:13.5px;color:var(--t2);margin-bottom:8px;">${n.instruction}</div>
      <div class="match-grid">
        <div><div class="match-col-hd">ข้อมูล A</div>${lH}</div>
        <div><div class="match-col-hd">ข้อมูล B</div>${rH}</div>
      </div>
      <div class="match-pips">${pips}</div>
      <div class="match-done${allDone?' show':''}">🎉 จับคู่ครบแล้ว! +40 XP</div>
    </div>
  </div>`;
}

function selMatch(side,idx){
  const k=`${S.ch}-${S.node}`;
  const ms=S.matchSt[k];
  const n=node();
  if(ms.matched.has(idx)&&side==='left') return;
  if([...ms.matched].includes(idx)&&side==='right') return;
  ms.wrongPair=null;
  if(ms.sel===null){ms.sel=idx;ms.side=side;render();return;}
  if(ms.side===side){ms.sel=idx;render();return;}
  const li=side==='right'?ms.sel:idx,ri=side==='right'?idx:ms.sel;
  if(n.pairs[li].right===n.pairs[ri].right){
    ms.matched.add(li);
    if(ms.matched.size===n.pairs.length){S.xp+=40;S.chCorrect[S.ch]++;S.chTotal[S.ch]++;S.totalCorrect++;S.totalQ++;}
  } else {
    ms.wrongPair={l:li,r:ri};
    S.lives=Math.max(0,S.lives-1);
    setTimeout(()=>{ms.wrongPair=null;render();},600);
  }
  ms.sel=null;ms.side=null;
  render();updateUI();
}

/* ── SORT ── */
function renderSort(n){
  const k=`${S.ch}-${S.node}`;
  if(!S.sortSt[k]){
    const sh=[...n.items];
    for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
    S.sortSt[k]={order:sh.map(x=>x.id),checked:false,correct:false};
  }
  const ss=S.sortSt[k];
  const map=Object.fromEntries(n.items.map(i=>[i.id,i]));
  const items=ss.order.map((id,i)=>`<div class="si" draggable="true" data-id="${id}" id="si-${id}">
    <span class="si-handle">⣿</span><span class="si-num">${i+1}</span>
    <span style="flex:1">${map[id].text}</span>
  </div>`).join('');
  return `<div class="card">
    <div class="card-header"><span class="badge b-orange">🔀 เกม: เรียงลำดับ</span><span style="font-size:11px;color:var(--t3);">ลากเพื่อเรียง</span></div>
    <div class="card-body">
      <div style="font-size:13.5px;color:var(--t2);margin-bottom:4px;">${n.instruction}</div>
      <div class="sort-items" id="sort-list">${items}</div>
      <button class="sort-check" onclick="checkSort()" ${ss.checked&&ss.correct?'disabled':''}>
        ${ss.checked&&ss.correct?'✅ ถูกต้องแล้ว!':'ตรวจคำตอบ'}
      </button>
      <div class="sort-fb${ss.checked?' show':''} ${ss.correct?'fb-ok':'fb-bad'}">
        ${ss.checked?(ss.correct?`🎉 ถูกต้อง! +30 XP<br><span style="font-size:12.5px;">${n.fb}</span>`:'❌ ลำดับยังไม่ถูก ลองลากเรียงใหม่แล้วกดตรวจอีกครั้งครับ'):''}
      </div>
    </div>
  </div>`;
}

function initSort(){
  const list=document.getElementById('sort-list');
  if(!list) return;
  let dragged=null;

  function commitDrop(target){
    if(!dragged||dragged===target) return;
    const items=[...list.querySelectorAll('.si')];
    const fi=items.indexOf(dragged),ti=items.indexOf(target);
    if(fi<ti) list.insertBefore(dragged,target.nextSibling);
    else list.insertBefore(dragged,target);
    const k=`${S.ch}-${S.node}`;
    S.sortSt[k].order=[...list.querySelectorAll('.si')].map(el=>el.dataset.id);
    S.sortSt[k].checked=false;
    list.querySelectorAll('.si').forEach((el,i)=>el.querySelector('.si-num').textContent=i+1);
  }

  list.querySelectorAll('.si').forEach(item=>{
    /* ── Desktop mouse drag ── */
    item.setAttribute('draggable','true');
    item.addEventListener('dragstart',()=>{dragged=item;item.classList.add('dragging');});
    item.addEventListener('dragend',()=>{item.classList.remove('dragging');dragged=null;});
    item.addEventListener('dragover',e=>{e.preventDefault();item.classList.add('over');});
    item.addEventListener('dragleave',()=>item.classList.remove('over'));
    item.addEventListener('drop',e=>{
      e.preventDefault();item.classList.remove('over');
      commitDrop(item);
    });

    /* ── Mobile touch drag ── */
    let ghost=null,lastOver=null;
    item.addEventListener('touchstart',e=>{
      dragged=item;
      item.classList.add('dragging');
      /* Create ghost clone that follows finger */
      ghost=item.cloneNode(true);
      ghost.style.cssText='position:fixed;opacity:0.75;pointer-events:none;z-index:9999;width:'+item.offsetWidth+'px;left:0;top:0;';
      document.body.appendChild(ghost);
    },{passive:true});

    item.addEventListener('touchmove',e=>{
      if(!dragged) return;
      e.preventDefault();
      const t=e.touches[0];
      if(ghost){ghost.style.left=(t.clientX-item.offsetWidth/2)+'px';ghost.style.top=(t.clientY-30)+'px';}
      /* Find element under finger (hide ghost first) */
      if(ghost) ghost.style.display='none';
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(ghost) ghost.style.display='';
      const target=el&&el.closest('.si');
      if(lastOver&&lastOver!==target) lastOver.classList.remove('over');
      if(target&&target!==dragged){target.classList.add('over');lastOver=target;}
    },{passive:false});

    item.addEventListener('touchend',e=>{
      item.classList.remove('dragging');
      if(ghost){ghost.remove();ghost=null;}
      if(lastOver){lastOver.classList.remove('over');commitDrop(lastOver);lastOver=null;}
      dragged=null;
    },{passive:true});
  });
}

function checkSort(){
  const n=node();
  const k=`${S.ch}-${S.node}`;
  const ss=S.sortSt[k];
  const correct=JSON.stringify(ss.order)===JSON.stringify(n.correct);
  ss.checked=true;ss.correct=correct;
  S.totalQ++;
  if(correct){S.chCorrect[S.ch]++;S.chTotal[S.ch]++;S.totalCorrect++;S.xp+=30;}else{S.xp+=5;S.lives=Math.max(0,S.lives-1);}
  render();updateUI();
  if(!correct && S.lives===0) setTimeout(showGameOver,400);
}

/* ── SCRAMBLE ── */
function renderScramble(n){
  const k=`${S.ch}-${S.node}`;
  const wi=S.scrambleIdx[k]||0;
  if(wi>=n.words.length){
    return `<div class="card"><div class="card-body" style="text-align:center;padding:24px;">
      <div style="font-size:36px;margin-bottom:10px;">🎉</div>
      <div style="font-size:16px;font-weight:700;color:var(--teal);margin-bottom:6px;">เรียงครบทุกคำแล้ว!</div>
      <div style="font-size:13px;color:var(--t2);">กดถัดไปเพื่อเรียนต่อครับ</div>
    </div></div>`;
  }
  const w=n.words[wi];
  if(!S.scrambleSt[k]) S.scrambleSt[k]=[];
  // shuffle
  const sKey=k+'-'+wi;
  if(!window._shuffled) window._shuffled={};
  if(!window._shuffled[sKey]){
    const arr=w.word.split('');
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    // ensure shuffled
    while(arr.join('')===w.word){const j=Math.floor(Math.random()*arr.length);const t=arr[0];arr[0]=arr[j];arr[j]=t;}
    window._shuffled[sKey]=arr;
  }
  const shuffled=window._shuffled[sKey];
  if(!window._ansSlots) window._ansSlots={};
  if(!window._ansSlots[sKey]) window._ansSlots[sKey]=Array(w.word.length).fill(null);
  if(!window._usedIdx) window._usedIdx={};
  if(!window._usedIdx[sKey]) window._usedIdx[sKey]=new Set();
  if(!window._selLetter) window._selLetter={};
  const ans=window._ansSlots[sKey];
  const used=window._usedIdx[sKey];
  const sel=window._selLetter[sKey];
  const isDone=ans.every(x=>x!==null);
  const isCorrect=isDone&&ans.join('')===w.word;

  const letters=shuffled.map((l,i)=>`<div class="s-letter${used.has(i)?' used':sel===i?' selected':''}" onclick="selLetter(${i})">${l}</div>`).join('');
  const slots=ans.map((l,i)=>`<div class="a-slot${l?' filled':''}" onclick="clearSlot(${i})">${l||''}</div>`).join('');

  return `<div class="card">
    <div class="card-header"><span class="badge b-orange">🔤 เกม: เรียงตัวอักษร</span><span style="font-size:11px;color:var(--t3);">คำที่ ${wi+1}/${n.words.length}</span></div>
    <div class="card-body">
      <div class="scramble-hint">${w.hint}</div>
      <div class="answer-slots">${slots}</div>
      <div class="scramble-word">${letters}</div>
      <div class="scramble-result show" style="color:${isCorrect?'var(--teal)':'var(--red)'};">
        ${isDone?(isCorrect?`✅ ถูกต้อง! "${w.word}" +${w.xp} XP`:`❌ ยังไม่ถูก — กดที่ช่องคำตอบเพื่อลบออกครับ`):''}
      </div>
    </div>
  </div>`;
}

function selLetter(i){
  const k=`${S.ch}-${S.node}`;
  const n=node();
  const wi=S.scrambleIdx[k]||0;
  const sKey=k+'-'+wi;
  const w=n.words[wi];
  const used=window._usedIdx[sKey];
  const ans=window._ansSlots[sKey];
  const shuffled=window._shuffled[sKey];
  if(used.has(i)) return;
  // fill first empty slot
  const emptyIdx=ans.findIndex(x=>x===null);
  if(emptyIdx===-1) return;
  ans[emptyIdx]=shuffled[i];
  used.add(i);
  window._selLetter[sKey]=null;
  // check correct
  if(ans.every(x=>x!==null)&&ans.join('')===w.word){
    S.xp+=w.xp;
    if(!S.scrambleSt[k]) S.scrambleSt[k]=[];
    S.scrambleSt[k][wi]=true;
    setTimeout(()=>{
      if(!S.scrambleIdx[k]) S.scrambleIdx[k]=0;
      S.scrambleIdx[k]=(S.scrambleIdx[k]||0)+1;
      render();updateUI();
    },800);
  }
  render();updateUI();
}

function clearSlot(i){
  const k=`${S.ch}-${S.node}`;
  const wi=S.scrambleIdx[k]||0;
  const sKey=k+'-'+wi;
  const ans=window._ansSlots[sKey];
  const used=window._usedIdx[sKey];
  const shuffled=window._shuffled[sKey];
  if(ans[i]===null) return;
  // find which original index
  const origIdx=shuffled.findIndex((l,idx)=>used.has(idx)&&l===ans[i]&&![...Array(i).keys()].some(j=>ans[j]===l&&shuffled.findIndex((ll,ii)=>ii!==idx&&used.has(ii)&&ll===l)===idx));
  // simpler: find first used index with that letter
  let found=-1;
  for(const ui of used){if(shuffled[ui]===ans[i]){found=ui;break;}}
  if(found!==-1) used.delete(found);
  ans[i]=null;
  render();
}

function initScramble(){}

/* ── DRAG FILL ── */
function renderDragFill(n){
  const k=`${S.ch}-${S.node}`;
  if(!S.dragFillSt[k]) S.dragFillSt[k]={sel:null,filled:{},checked:false,correct:false};
  const df=S.dragFillSt[k];
  const tokens=n.tokens.map((t,i)=>{
    const used=Object.values(df.filled).includes(t);
    const sel=df.sel===i;
    return `<div class="drag-token${used?' used':sel?' selected':''}" onclick="selToken(${i})">${t}</div>`;
  }).join('');
  const blanks=n.blanks.map((b,bi)=>{
    const val=df.filled[bi];
    let cls=val?'filled':'';
    if(df.checked){cls=val===b.ans?'correct-b':'wrong-b';}
    return `<div class="drag-blank-row">
      <span class="drag-blank-label">${b.label}</span>
      <div class="drag-blank ${cls}" onclick="fillBlank(${bi})">${val||'คลิกเพื่อเติม'}</div>
      <span style="font-size:12px;color:var(--t3);">${b.unit}</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-header"><span class="badge b-orange">🔢 เกม: เติมตัวเลข</span></div>
    <div class="card-body">
      <div style="font-size:13.5px;color:var(--t2);margin-bottom:10px;">${n.instruction}</div>
      <div class="drag-tokens">${tokens}</div>
      <div class="drag-blanks">${blanks}</div>
      <div class="btn-row">
        <button class="btn gold" onclick="checkFill()" ${df.checked&&df.correct?'disabled':''}>ตรวจคำตอบ</button>
        <button class="btn" onclick="resetFill()">รีเซ็ต</button>
      </div>
      ${df.checked?`<div class="sort-fb show ${df.correct?'fb-ok':'fb-bad'}" style="display:block;">
        ${df.correct?'🎉 ถูกต้องทั้งหมด! +40 XP':'❌ บางข้อยังไม่ถูก — ลองใหม่ครับ'}
      </div>`:''}
    </div>
  </div>`;
}

function selToken(i){
  const k=`${S.ch}-${S.node}`;
  const df=S.dragFillSt[k];
  const n=node();
  const val=n.tokens[i];
  if(Object.values(df.filled).includes(val)) return;
  df.sel=df.sel===i?null:i;
  render();
}

function fillBlank(bi){
  const k=`${S.ch}-${S.node}`;
  const df=S.dragFillSt[k];
  const n=node();
  if(df.sel===null){
    // clear slot
    delete df.filled[bi];
  } else {
    const val=n.tokens[df.sel];
    df.filled[bi]=val;
    df.sel=null;
  }
  df.checked=false;
  render();
}

function resetFill(){
  const k=`${S.ch}-${S.node}`;
  S.dragFillSt[k]={sel:null,filled:{},checked:false,correct:false};
  render();
}

function checkFill(){
  const k=`${S.ch}-${S.node}`;
  const df=S.dragFillSt[k];
  const n=node();
  const correct=n.blanks.every((b,i)=>df.filled[i]===b.ans);
  df.checked=true;df.correct=correct;
  S.totalQ++;
  if(correct){S.totalCorrect++;S.xp+=40;S.chCorrect[S.ch]++;S.chTotal[S.ch]++;}else{S.xp+=5;S.lives=Math.max(0,S.lives-1);}
  render();updateUI();
  if(!correct && S.lives===0) setTimeout(showGameOver,400);
}

/* ── SUMMARY ── */
function renderSummary(){
  const prePct=Math.round(S.preAns.filter((a,i)=>a===PRE_TEST[i].ans).length/PRE_TEST.length*100);
  const postPct=Math.round(S.postAns.filter((a,i)=>a===POST_TEST[i].ans).length/POST_TEST.length*100);
  const midPct=S.totalQ>0?Math.round(S.totalCorrect/S.totalQ*100):0;
  const overallPct=Math.round((S.totalCorrect+S.postAns.filter((a,i)=>a===POST_TEST[i].ans).length)/
    (S.totalQ+POST_TEST.length)*100);
  const badge=overallPct>=80?{t:'นักดาราศาสตร์ผู้เชี่ยวชาญ 🌟',bg:'rgba(245,200,66,.15)',c:'var(--gold)'}

  const topicData=topics.map((t,i)=>{
    const preQ=PRE_TEST.filter(q=>q.ch===i);
    const postQ=POST_TEST.filter(q=>q.ch===i);
    const preC=preQ.filter((q,qi)=>S.preAns[PRE_TEST.indexOf(q)]===q.ans).length;
    const postC=postQ.filter((q,qi)=>S.postAns[POST_TEST.indexOf(q)]===q.ans).length;
    const prePt=Math.round(preC/preQ.length*100);
    const postPt=Math.round(postC/postQ.length*100);
    const midC=S.chCorrect[i],midT=S.chTotal[i];
    const midPt=midT>0?Math.round(midC/midT*100):0;
    const avg=Math.round((prePt+postPt+midPt)/3);
    return {topic:t,pre:prePt,post:postPt,mid:midPt,avg,ch:i};
  });

  const weak=topicData.filter(d=>d.avg<60);

  if(postPct>prePct) advices.push(`คะแนนหลังเรียนสูงขึ้นจาก ${prePct}% เป็น ${postPct}% — เยี่ยมมากครับ!`);

      <div class="score-ring-wrap" id="score-ring-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="score-ring-track" cx="75" cy="75" r="${r}" fill="none" stroke-width="${stroke}"/>
          <circle class="score-ring-fill" id="score-ring-circle" cx="75" cy="75" r="${r}"
            fill="none" stroke-width="${stroke}" stroke="${ringColor}"
            stroke-dasharray="${ringCirc}" stroke-dashoffset="${ringCirc}"/>
        </svg>
        <div class="score-ring-text">
          <div class="score-ring-num" style="color:${ringColor};" id="score-ring-num" data-pct="${overallPct}">0%</div>
          <div class="score-ring-label">SCORE</div>
        </div>
      </div>
      <span class="sum-badge" style="background:${badge.bg};color:${badge.c};font-size:14px;padding:8px 20px;">${badge.t}</span>
    </div>

    <div class="sum-grid" style="grid-template-columns:repeat(4,1fr);gap:8px;">

function animateScoreRing(){
  const circle=document.getElementById('score-ring-circle');
  const numEl=document.getElementById('score-ring-num');
  if(!circle||!numEl) return;
  const pct=parseInt(numEl.dataset.pct||'0')||0;
  const r=parseFloat(circle.getAttribute('r'));
  const circ=2*Math.PI*r;
  const targetOffset=circ-(pct/100)*circ;
  // Animate dashoffset
  circle.style.transition='stroke-dashoffset 1.4s cubic-bezier(.34,.85,.27,.99)';
  requestAnimationFrame(()=>{
    circle.style.strokeDashoffset=targetOffset;
  });
  // Count-up number
  let start=0, dur=1400, t0=null;
  function tick(ts){
    if(!t0) t0=ts;
    const prog=Math.min((ts-t0)/dur,1);
    const ease=prog<0.5?2*prog*prog:(4-2*prog)*prog-1; // easeInOut
    start=Math.round(ease*pct);
    numEl.textContent=start+'%';
    if(prog<1) requestAnimationFrame(tick);
    else numEl.textContent=pct+'%';
  }
  requestAnimationFrame(tick);
}

function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas) return;
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const cols=['#6c8ef5','#a78bfa','#34d399','#f5c842','#f472b6','#fb923c','#60a5fa','#fde68a','#ffffff'];
  const ps=Array.from({length:150},()=>({
    x:Math.random()*canvas.width,
    y:-20-Math.random()*100,
    w:Math.random()*11+4,
    h:Math.random()*6+3,
    c:cols[Math.floor(Math.random()*cols.length)],
    vy:Math.random()*4+2,
    vx:(Math.random()-0.5)*2.5,
    rot:Math.random()*360,
    rotV:(Math.random()-0.5)*7,
    op:1
  }));
  let f=0;
  if(window._confettiRaf) cancelAnimationFrame(window._confettiRaf);
  function drawConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ps.forEach(p=>{
      ctx.save();
      ctx.globalAlpha=p.op;
      ctx.translate(p.x+p.w/2,p.y+p.h/2);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.rotV;
      p.vx+=Math.sin(f*0.05+p.x*0.01)*0.06;
      if(f>180) p.op=Math.max(0,p.op-0.013);
    });
    f++;
    if(f<360&&ps.some(p=>p.op>0)){
      window._confettiRaf=requestAnimationFrame(drawConfetti);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      window._confettiRaf=null;
    }
  }
  drawConfetti();
}

function saveProgress(){
  try{
    if(S.phase==='welcome') return;
    const mSer={};
    Object.entries(S.matchSt).forEach(([k,v])=>{
      mSer[k]={...v,matched:[...v.matched]};
    });
    const uSer={};
    Object.entries(window._usedIdx||{}).forEach(([k,v])=>{uSer[k]=[...v];});
    const payload={
      S:{...S,matchSt:mSer},
      _shuffled:window._shuffled||{},
      _ansSlots:window._ansSlots||{},
      _usedIdx:uSer,
      _selLetter:window._selLetter||{}
    };
    localStorage.setItem('ulp_v3',JSON.stringify(payload));
  }catch(e){}
}

function loadProgress(){
  try{
    const raw=localStorage.getItem('ulp_v3');
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d||!d.S) return false;
    S=d.S;
    Object.entries(S.matchSt).forEach(([k,v])=>{
      S.matchSt[k].matched=new Set(v.matched);
    });
    window._shuffled=d._shuffled||{};
    window._ansSlots=d._ansSlots||{};
    window._usedIdx={};
    Object.entries(d._usedIdx||{}).forEach(([k,v])=>{window._usedIdx[k]=new Set(v);});
    window._selLetter=d._selLetter||{};
    return true;
  }catch(e){return false;}
}

function getClassRecords(){
  try{
    const raw=localStorage.getItem('ulp_class_v1');
    return raw?JSON.parse(raw):[];
  }catch(e){return [];}
}

function saveClassRecord(record){
  try{
    const records=getClassRecords();
    const idx=records.findIndex(r=>
      r.student?.name===record.student?.name&&
      r.student?.cls===record.student?.cls&&
      r.student?.date===record.student?.date
    );
    if(idx>=0) records[idx]=record;
    else records.push(record);
    localStorage.setItem('ulp_class_v1',JSON.stringify(records));
  }catch(e){}
}

function getOverallPct(r){
  const postCorrect=(r.postAns||[]).filter((a,i)=>a===POST_TEST[i]?.ans).length;
  const total=(r.totalQ||0)+(r.postAns?.length||0);
  const correct=(r.totalCorrect||0)+postCorrect;
  return total>0?Math.round(correct/total*100):0;
}

function deleteRecord(idx){
  if(!confirm('ลบผลการเรียนนี้?')) return;
  const records=getClassRecords();
  records.splice(idx,1);
  localStorage.setItem('ulp_class_v1',JSON.stringify(records));
  render();
}

function importStudentFile(input){
  const files=[...input.files];
  if(!files.length) return;
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const d=JSON.parse(e.target.result);
        const rec=d&&d.S&&d.S.student?d.S:(d&&d.student?d:null);
        if(rec&&rec.student?.name) saveClassRecord(rec);
      }catch(err){}
      loaded++;
      if(loaded===files.length){input.value='';render();}
    };
    reader.readAsText(file,'utf-8');
  });
}

    a.click(); URL.revokeObjectURL(url);
  }catch(e){alert('ไม่สามารถบันทึกไฟล์ได้');}
}

function exportCSV(){
  const records=getClassRecords();
  if(!records.length) return;
  const BOM='﻿';
  const headers=['ชื่อ-นามสกุล','ชั้น','วันที่','อวตาร','Pre-test %','Post-test %','XP','ชีวิตเหลือ','ภาพรวม %'];
  const rows=records.map(r=>{
    const prePct=r.preAns&&r.preAns.length===PRE_TEST.length
      ?Math.round(r.preAns.filter((a,i)=>a===PRE_TEST[i].ans).length/PRE_TEST.length*100):0;
    const postPct=r.postAns&&r.postAns.length===POST_TEST.length
      ?Math.round(r.postAns.filter((a,i)=>a===POST_TEST[i].ans).length/POST_TEST.length*100):0;
    return [
      r.student?.name||'',r.student?.cls||'',r.student?.date||'',r.student?.avatar||'',
      prePct,postPct,r.xp||0,r.lives??3,getOverallPct(r)
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv=BOM+[headers.join(','),...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`class_results_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);

/* ── ADAPTIVE PERFORMANCE ── */
(function adaptivePerf(){
  var lowPerf = window.innerWidth < 768 ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) ||
    (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
  if(lowPerf){
    var gb = document.getElementById('galaxy-bg');
    var sf = document.getElementById('starfield-parallax');
    if(gb) gb.style.display='none';
    if(sf) sf.style.display='none';
    /* ปิด mousemove parallax โดย overwrite */
    window._parallaxDisabled = true;
  }
})();
(function initStarfield(){
  const container = document.getElementById('starfield-parallax');
  if (!container) return;
  const COUNT = 70;
  const stars = [];
  for (let i = 0; i < COUNT; i++) {
    const s = {
      x: Math.random() * 100,
      y: Math.random() * 100,
      size: Math.random() * 1.8 + 0.3,
      opacity: Math.random() * 0.75 + 0.2,
      delay: Math.random() * 5,
      duration: 2 + Math.random() * 4,
      layer: Math.random() < 0.3 ? 2 : 1,
    };
    const el = document.createElement('div');
    el.className = 'p-star';
    el.style.cssText =
      `left:${s.x}%;top:${s.y}%;` +
      `width:${s.size}px;height:${s.size}px;` +
      `opacity:${s.opacity};` +
      `animation:twinkle ${s.duration}s ease-in-out ${s.delay}s infinite;`;
    container.appendChild(el);
    stars.push({ el, layer: s.layer });
  }
  // Parallax on mouse move
  let ticking = false;
  window.addEventListener('mousemove', function(e) {
    if(window._parallaxDisabled) return;
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() {
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;
      const ox = (e.clientX - cx) / cx;
      const oy = (e.clientY - cy) / cy;
      stars.forEach(function(s) {
        const strength = s.layer * 5;
        s.el.style.transform = `translate(${ox*strength}px, ${oy*strength}px)`;
      });
      ticking = false;
    });
  });
})();



loadProgress();
render(true);

/* ── CONFETTI ── */
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const cols=['#4f8ef7','#a78bfa','#2dd4bf','#fbbf24','#f472b6','#fb923c','#34d399'];
  const pieces=Array.from({length:100},()=>({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height-canvas.height,
    r:Math.random()*5+3,
    d:Math.random()*100,
    c:cols[Math.floor(Math.random()*cols.length)],
    tilt:Math.floor(Math.random()*10)-10,
    tiltAngle:0,
    tiltAngleInc:Math.random()*0.07+0.05
  }));
  let angle=0,frame;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    angle+=0.01;
    pieces.forEach(p=>{
      p.tiltAngle+=p.tiltAngleInc;
      p.y+=(Math.cos(angle+p.d)+2.5);
      p.x+=Math.sin(angle)*1.5;
      p.tilt=Math.sin(p.tiltAngle)*12;
      ctx.beginPath();
      ctx.lineWidth=p.r/2;
      ctx.strokeStyle=p.c;
      ctx.moveTo(p.x+p.tilt+p.r/4,p.y);
      ctx.lineTo(p.x+p.tilt,p.y+p.tilt+p.r/4);
      ctx.stroke();
      if(p.y>canvas.height){p.y=-20;p.x=Math.random()*canvas.width;}
    });
    frame=requestAnimationFrame(draw);
  }
  draw();
  setTimeout(()=>{cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height);},3000);
}

function renderTeacherDash(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('ulp_v3_'));
  if(!keys.length) return `<div class="td-empty">ยังไม่มีนักเรียนเข้าใช้งาน<br>รอนักเรียนเริ่มบทเรียนก่อนครับ 🚀</div>`;
  return keys.map(k=>{
    try{
      const d=JSON.parse(localStorage.getItem(k));
      const s=d.student||{};
      const pct=d.totalQ>0?Math.round(d.totalCorrect/d.totalQ*100):0;
      const col=pct>=70?'var(--teal)':pct>=50?'var(--gold)':'var(--red)';
      return `<div class="td-card">
        <div class="td-student">
          <div class="td-av">${s.avatar||'🧑‍🚀'}</div>
          <div class="td-info"><div class="td-name">${s.name||'ไม่ระบุ'}</div><div class="td-meta">ห้อง ${s.cls||'-'} | ${s.date||'-'}</div></div>
          <div class="td-score"><div class="td-pct" style="color:${col}">${pct}%</div></div>
          <button class="td-del" onclick="deleteStudent('${k}')">ลบ</button>
        </div>
        <div class="td-stats">
          <div class="td-stat"><div class="td-stat-val">${d.xp||0}</div><div class="td-stat-label">XP</div></div>
          <div class="td-stat"><div class="td-stat-val">${d.totalCorrect||0}/${d.totalQ||0}</div><div class="td-stat-label">ถูก/ทั้งหมด</div></div>
          <div class="td-stat"><div class="td-stat-val">${d.lives!==undefined?d.lives:'-'}</div><div class="td-stat-label">หัวใจเหลือ</div></div>
        </div>
      </div>`;
    }catch(e){return '';}
  }).join('');
}
